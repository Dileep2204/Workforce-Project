name: SSKATT full-stack checks

on:
  push:
    branches: [main, feature/production-backend-postgres]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      SUPERADMIN_PASSWORD: ci-only-password-do-not-use-in-production
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend Python files
        run: python -m compileall -q app migrations tests
      - name: Run backend and frontend contract tests
        run: python -m pytest -q
      - name: Check embedded frontend JavaScript syntax
        run: |
          python -c "import re, pathlib; s=pathlib.Path('../index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', s, re.I); pathlib.Path('/tmp/sskatt-inline.js').write_text(scripts[-1], encoding='utf-8')"
          node --check /tmp/sskatt-inline.js
