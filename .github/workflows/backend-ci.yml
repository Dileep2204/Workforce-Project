name: SSKATT backend checks

on:
  push:
    branches: [main, feature/production-backend-postgres]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      SUPERADMIN_PASSWORD: ci-only-password-do-not-use-in-production
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend Python files
        run: python -m compileall -q app migrations tests
      - name: Run authorization tests
        run: python -m pytest -q
