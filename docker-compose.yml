services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sskatt
      POSTGRES_USER: sskatt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sskatt_local_password}
    volumes:
      - sskatt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sskatt -d sskatt"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sskatt_postgres_data:
