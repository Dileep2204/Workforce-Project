services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sskatt
      POSTGRES_USER: sskatt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sskatt_local_password}
    volumes:
      - sskatt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sskatt -d sskatt"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sskatt_postgres_data:
